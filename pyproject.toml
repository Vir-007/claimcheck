[project]
name = "claimcheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anarch", email = "2vir.sharma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tokenizers>=0.23.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
claimcheck = "claimcheck:main"

[project.optional-dependencies]
llm = [
    "anthropic>=1.11.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
